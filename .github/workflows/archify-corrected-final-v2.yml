name: Archify corrected final architectures v2
on:
  push:
    branches: [archify-corrected-final-20261003]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Download canonical Archify v3.0.1
        run: |
          curl -L --fail --retry 3 https://github.com/tt-a1i/archify/releases/download/v3.0.1/archify.zip -o /tmp/archify.zip
          echo "b0b23bd28db314f04ca8ab9620fe20f8c1ac6474a3546bd8fe4679508aa1b7f5  /tmp/archify.zip" | sha256sum -c -
          mkdir -p /tmp/archify && unzip -q /tmp/archify.zip -d /tmp/archify
      - name: Finalize corrected System Architecture
        shell: bash
        run: |
          set -o pipefail
          CLI="$(find /tmp/archify -path '*/bin/archify.mjs' | head -n 1)"
          node "$CLI" finalize architecture .archify/final-system/candidate.json .archify/final-system/cobot3-system.architecture.html --quality standard --json | tee .archify/final-system/finalize-receipt.json
      - name: Finalize corrected ROS 2 Node Communication Architecture
        shell: bash
        run: |
          set -o pipefail
          CLI="$(find /tmp/archify -path '*/bin/archify.mjs' | head -n 1)"
          node "$CLI" finalize architecture .archify/final-ros2/candidate.json .archify/final-ros2/cobot3-ros2-node-communication.architecture.html --quality standard --json | tee .archify/final-ros2/finalize-receipt.json
      - name: Capture browser evidence and official SVG exports
        shell: bash
        run: |
          set -o pipefail
          CLI="$(find /tmp/archify -path '*/bin/archify.mjs' | head -n 1)"
          ROOT="$(dirname "$(dirname "$CLI")")"
          node "$CLI" visual-check .archify/final-system/cobot3-system.architecture.html --require-provenance --json > .archify/final-system/visual-check-receipt.json
          node "$CLI" visual-check .archify/final-ros2/cobot3-ros2-node-communication.architecture.html --require-provenance --json > .archify/final-ros2/visual-check-receipt.json
          node .archify/export-and-audit.mjs "$ROOT" .archify/final-system/cobot3-system.architecture.html .archify/final-ros2/cobot3-ros2-node-communication.architecture.html
      - name: Upload corrected architectures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobot3-corrected-final-architectures-v2
          if-no-files-found: warn
          path: |
            .archify/final-system/**
            .archify/final-ros2/**
            .archify/final-combined/**
