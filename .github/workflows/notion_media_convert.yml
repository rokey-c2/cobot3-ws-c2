name: Prepare Notion demo videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notion_media_convert.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert WEBM demos to compact H.264 MP4
        shell: bash
        run: |
          set -euo pipefail
          convert_video () {
            in="$1"
            out="$2"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$in")
            bitrate=$(python3 - "$dur" <<'PY'
import sys
d=max(float(sys.argv[1]),1.0)
target_bytes=4.2*1024*1024
bps=int(target_bytes*8/d)
print(max(120000,min(900000,bps)))
PY
)
            ffmpeg -y -i "$in"               -vf "scale='min(960,iw)':-2:force_original_aspect_ratio=decrease,fps=12"               -c:v libx264 -preset medium -b:v "$bitrate" -maxrate "$bitrate" -bufsize "$((bitrate*2))"               -pix_fmt yuv420p -an -movflags +faststart "$out"
            ls -lh "$out"
          }

          convert_video docs/screenshots/isaac-sim-record.webm docs/screenshots/isaac-sim-record-notion.mp4
          convert_video docs/screenshots/manual-move.webm docs/screenshots/manual-move-notion.mp4
          convert_video docs/screenshots/top-view.webm docs/screenshots/top-view-notion.mp4
          convert_video docs/screenshots/rviz2-and-termial.webm docs/screenshots/rviz2-and-terminal-notion.mp4

      - name: Commit Notion MP4 copies
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*-notion.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add Notion-compatible demo videos"
          git push
