bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: amr_a/base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 5000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odom
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.65
      lookahead_dist: 0.80
      min_lookahead_dist: 0.40
      max_lookahead_dist: 1.20
      lookahead_time: 1.5
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.70
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.50
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.70
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      allow_reversing: false
      use_interpolation: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: amr_a/odom
      robot_base_frame: amr_a/base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 0.30
      footprint: "[[0.65, 0.38], [0.65, -0.38], [-0.55, -0.38], [-0.55, 0.38]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.20
        observation_sources: scan
        scan:
          topic: scan_nav
          data_type: "LaserScan"
          clearing: true
          marking: true
          expected_update_rate: 0.20
          observation_persistence: 0.30
          max_obstacle_height: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 20.0
          obstacle_min_range: 0.10
          obstacle_max_range: 18.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: amr_a/base_link
      resolution: 0.05
      track_unknown_space: false
      transform_tolerance: 0.30
      footprint: "[[0.65, 0.38], [0.65, -0.38], [-0.55, -0.38], [-0.55, 0.38]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 0.20
        observation_sources: scan
        scan:
          topic: scan_nav
          data_type: "LaserScan"
          clearing: true
          marking: true
          expected_update_rate: 0.20
          observation_persistence: 0.50
          max_obstacle_height: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 20.0
          obstacle_min_range: 0.10
          obstacle_max_range: 18.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: amr_a/odom
    global_frame: map
    robot_base_frame: amr_a/base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.5
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.80, 0.0, 0.90]
    min_velocity: [-0.30, 0.0, -0.90]
    max_accel: [0.80, 0.0, 1.50]
    max_decel: [-1.00, 0.0, -1.80]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: amr_a/base_link
    odom_frame_id: amr_a/odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_safe
    transform_tolerance: 0.30
    # scan_nav is restamped against /clock, so stale or missing scans must stop
    # the vehicle instead of silently disabling collision protection.
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons: ["iw_hub_approach"]
    iw_hub_approach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: iw_hub_approach
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: scan_nav
      min_height: 0.05
      max_height: 2.5
      enabled: true
