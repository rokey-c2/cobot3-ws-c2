3px}#cobot-preview .connections{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}#cobot-preview .connection{font-size:11px;overflow-wrap:anywhere}#cobot-preview .connection small{display:block;color:var(--sub);font-size:10px;margin-top:2px}#cobot-preview footer{padding:10px 24px;border-top:1px solid var(--line);font-size:10px;color:var(--sub);display:flex;justify-content:space-between;gap:10px}#cobot-preview.expanded .rail{display:none}#cobot-preview.expanded .layout{grid-template-columns:1fr}#cobot-preview.expanded .canvas{height:720px}@media(max-width:740px){#cobot-preview .layout{grid-template-columns:1fr}#cobot-preview .rail{flex-direction:row;padding:10px 18px;border-right:0;border-bottom:1px solid var(--line);flex-wrap:wrap}#cobot-preview .rail-label,#cobot-preview .rail-bottom{display:none}#cobot-preview .view{padding:7px 11px}#cobot-preview .view small{display:none}#cobot-preview .themes{margin-right:0}#cobot-preview .page-head{flex-wrap:wrap;padding:18px}#cobot-preview .canvas{height:470px}#cobot-preview .inspector{padding:16px 18px}#cobot-preview .top{padding:15px 18px}#cobot-preview .theme{padding:8px}#cobot-preview footer{flex-wrap:wrap}}@media(pointer:coarse){#cobot-preview button{min-height:44px}}

<main class="main"><div class="page-head"><div><div class="breadcrumb"><span class="current-name">System Architecture</span></div><h2 class="view-title">시스템 아키텍쳐</h2><p class="subtitle">관제부터 로봇 실행까지, 구성 요소와 연결을 한눈에.</p></div></div>

</div>
<script>(()=>{
  const root=document.getElementById('cobot-preview');
  const frames={system:document.getElementById('system-viewer'),ros:document.getElementById('ros-viewer'),erd:document.getElementById('erd-viewer'),flow:document.getElementById('flow-viewer')};
  const paths={system:'01_system_architecture.html',ros:'02_ros2_node_communication_architecture.html',erd:'03_erd_v2.html',flow:'04_flow_chart_v2.html'};
  const views={system:['시스템 아키텍쳐','System Architecture','관제부터 로봇 실행까지, 구성 요소와 연결을 한눈에.'],ros:['ROS 2 통신 아키텍쳐','ROS 2 Communication Architecture','노드 사이의 토픽·액션과 프로세스 내부 연결을 살펴보세요.'],erd:['ERD','Entity Relationship Diagram','물류 관제의 8개 테이블과 컬럼·키·관계를 살펴보세요.'],flow:['공정 플로우차트','Flow Chart','운반 → IN 작업 → 분류 및 AMR 복귀, 조건과 오류 분기까지.']};
  let mode='system',theme='dark';
  function syncFrame(frame){
    const doc=frame.contentDocument;
    if(!doc||!doc.getElementById('btn-theme'))return;
    if(doc.documentElement.getAttribute('data-theme')!==theme)doc.getElementById('btn-theme').click();
  }
  function setTheme(next){
    if(next!=='light'&&next!=='dark')return;
    theme=next;root.dataset.theme=theme;
    document.documentElement.style.colorScheme=theme;
    document.body.style.background=theme==='dark'?'#08111e':'#f7f9fc';
    root.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)));
    for(const frame of Object.values(frames))syncFrame(frame);
  }
  for(const frame of Object.values(frames)){
    frame.addEventListener('load',()=>{
      syncFrame(frame);
      const doc=frame.contentDocument;
      if(!doc||!doc.getElementById('btn-theme'))return;
      const style=doc.createElement('style');
      style.textContent='html:not([data-present="true"]),html:not([data-present="true"]) body{min-height:0!important}html:not([data-present="true"]){overflow:hidden!important}';
      doc.head.append(style);
      // Measure the normal document flow, not floating toolbars or popovers.
      // Scroll-driven style changes must never change the iframe's height.
      let resizeTimer=0;
      const resize=()=>{
        clearTimeout(resizeTimer);
        if(frame.hidden)return;
        resizeTimer=setTimeout(()=>{
          if(frame.hidden||doc.documentElement.getAttribute('data-present')==='true')return;
          const bodyStyle=frame.contentWindow.getComputedStyle(doc.body);
          const shell=doc.querySelector('.container');
          const normalHeight=shell
            ? shell.offsetHeight+(parseFloat(bodyStyle.paddingTop)||0)+(parseFloat(bodyStyle.paddingBottom)||0)
            : doc.body.offsetHeight;
          const height=Math.ceil(Math.max(normalHeight,doc.body.offsetHeight))+4;
          if(Math.abs(parseFloat(frame.style.height||'0')-height)>4)frame.style.height=height+'px';
        },100);
      };
      frame.resizeToContent=resize;
      const sizeObserver=new ResizeObserver(resize);
      sizeObserver.observe(doc.body);
      const shell=doc.querySelector('.container');
      if(shell)sizeObserver.observe(shell);
      doc.fonts.ready.then(resize);
      frame.contentWindow.addEventListener('resize',resize);
      new MutationObserver(resize).observe(doc.documentElement,{attributes:true,attributeFilter:['data-present']});
      resize();
      new MutationObserver(()=>{const next=doc.documentElement.getAttribute('data-theme');if(next!==theme)setTheme(next)}).observe(doc.documentElement,{attributes:true,attributeFilter:['data-theme']});
    });
  }
  root.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeChoice)));
  root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    mode=b.dataset.mode;window.scrollTo({top:0,behavior:'instant'});
    root.querySelectorAll('[data-mode]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));
    for(const [key,frame] of Object.entries(frames))frame.hidden=key!==mode;
    const frame=frames[mode];
    if(!frame.getAttribute('src'))frame.src=paths[mode]+'?theme='+theme+'&rev=flow-top-bottom-1';
    else {syncFrame(frame);frame.contentWindow.dispatchEvent(new Event('resize'));if(frame.resizeToContent)frame.resizeToContent();}
    root.querySelector('.view-title').textContent=views[mode][0];
    root.querySelector('.current-name').textContent=views[mode][1];
    root.querySelector('.subtitle').textContent=views[mode][2];
  }));
  setTheme('dark');
})();
</script>
